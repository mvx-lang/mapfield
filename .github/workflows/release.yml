# Release mapfield on a version tag: publish the source package as a GitHub
#
# TAG THE COMMIT BEING RELEASED, NOT THE MERGE THAT BRINGS IT TO MAIN
# (mvx#343, and #19 here).  Merge develop into main as usual, then tag the
# merge's SECOND PARENT -- develop's HEAD:
#
#     git checkout main && git merge develop      # as before
#     git tag 1.1.2 "$(git rev-parse main^2)"     # NOT main
#
# Main only ever receives develop merges, so the two have the SAME TREE and a
# checkout of either is byte-for-byte identical -- the ARTIFACT is the same
# whichever you tag.  What differs is what the release can be seen as: only the
# second parent is an ancestor of develop as well as main, and `git describe`
# walks back to the nearest REACHABLE tag, which a merge commit on main is not.
#
# THIS REPO HAS THE SCAR.  1.1.0 was tagged on e88bb24, "Merge pull request #10
# from mvx-lang/develop", so develop could not see its own release:
#
#     git describe --tags --match '[0-9]*' e4c7348   ->  1.1.0-beta1-3-ge4c7348
#
# develop reported itself as three commits past the BETA while 1.1.0 was the
# published release.  1.1.1 was tagged on main^2 and describes as `1.1.1`.
#
# If main ever carries something develop does not -- a hotfix committed there
# directly -- the trees differ and the merge itself is what to tag.  The
# `tag-placement` job below says when that has happened rather than leaving it
# to be found at the next release.
# release asset.  mapfield is pure BASIC (no native build) — it installs by
# cataloging BP/MAPFIELD — so a single portable source artifact is all it ships.
# Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only.
name: release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"
      # ONE rolling dev tag, moved to the HEAD of develop by the nightly when
      # there is something new.  It builds through THIS workflow rather than
      # a second copy of it, so a dev build is the same artifacts by the same
      # steps as a release -- the only way a dev build is worth having.
      - "dev"
  # A TAG PUSHED BY A WORKFLOW DOES NOT TRIGGER ONE.  GitHub will not let the
  # default GITHUB_TOKEN start another run -- it is how recursion is prevented
  # -- so the nightly's tag lands and nothing happens.  It dispatches this
  # workflow on the tag instead, which is the same build from the same ref.
  workflow_dispatch:

permissions:
  contents: write
jobs:
  # A WARNING, NOT A GATE.  A main-only hotfix is a legitimate reason for
  # develop not to see a tag, so this reports to the step summary and lets the
  # release proceed -- and it depends on nothing and nothing depends on it, so
  # it can never hold a release up.  What it buys is that the answer arrives
  # with the release instead of when someone thinks to look, which for 1.1.0
  # was four months.
  tag-placement:
    name: develop can see this tag
    runs-on: ubuntu-latest
    # Only for a real version tag: `dev` is a rolling tag that is MEANT to move,
    # and a workflow_dispatch on a branch has no tag to place.
    if: ${{ github.ref_type == 'tag' && github.ref_name != 'dev' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # describe needs the history and the tags
      - name: What develop will call itself
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          git fetch --quiet origin develop || {
            echo "no develop branch here; nothing to check" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          # --match '[0-9]*' because this repo's tags carry no `v` prefix, and
          # without it `describe` would happily return `dev` -- the rolling tag
          # -- and call every placement correct.
          desc="$(git describe --tags --match '[0-9]*' origin/develop 2>/dev/null || echo '(none)')"
          echo "develop describes as \`$desc\`" >> "$GITHUB_STEP_SUMMARY"
          case "$desc" in
            "$TAG")
              echo "develop can see $TAG." >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "::warning title=develop cannot see $TAG::develop describes as '$desc', so builds from it report that and not $TAG. For a develop release the tag belongs on the merge's second parent (git rev-parse main^2) -- see this workflow's header. For a main-only hotfix this is expected."
              {
                echo
                echo "**develop cannot see \`$TAG\`.** Builds from develop will"
                echo "report \`$desc\`. For a develop release the tag belongs on"
                echo "the merge's second parent (\`git rev-parse main^2\`); for a"
                echo "main-only hotfix this is expected."
              } >> "$GITHUB_STEP_SUMMARY" ;;
          esac

  # THE MANIFESTS MUST NAME THE TAG, and this runs before anything is built so a
  # mismatch fails the release instead of shipping in it.  The published 1.1.0
  # artifact declared itself 1.0.0, with PKG line 2 saying "1.0" and
  # mvpkg.json "1.0.0" -- two spellings, so neither looked wrong beside the
  # other, and nothing reads these fields back except MVPKG info on a stored
  # manifest (#14).
  #
  # EVERY OTHER JOB DEPENDS ON THIS ONE, including `source`, whose staging lives
  # outside this repo: publish-source and build-pkg.sh both copy the in-tree PKG
  # and mvpkg.json verbatim, so checking those two files once covers all four
  # artifacts.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The manifests declare the tag
        run: sh tests/manifest-version.sh "${GITHUB_REF_NAME}"

  source:
    needs: [manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mvx/.github/actions/publish-source@main
        with:
          package: mvx-lang/mapfield
          artifact: mapfield
          title: mapfield
          body: "MAPFIELD — the %MAP% spec builder (Pick <-> JSON/YAML/XML projection). Pure BASIC; indexed by the package registry."

  # ---- the account artifact, one per system it runs on ------------------------
  # mapfield is BASIC only, so the staged account is IDENTICAL for udt, uv and
  # jbase -- what differs is the system name in the artifact key, and the
  # cataloging, which MVPKG does on the target.  Hence `any-any-le` and a plain
  # hosted runner rather than the licensed containers: os/arch-locking a package
  # with no native code would pin it to whichever machine packaged it.
  #
  # Without these the registry serves this package as `source` on every system,
  # which is what it did for every port until now.
  #
  # AFTER source and ONE AT A TIME: each upload creates the release if it is not
  # there yet, so jobs starting together race and all but one lose with
  # `already_exists` on tag_name -- which leaves a release that looks complete
  # unless you count the assets (curl-cmd#7).
  account:
    needs: [source]
    strategy:
      max-parallel: 1
      matrix:
        system: [udt, uv, jbase]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stage the ${{ matrix.system }} account
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          BASE="mapfield-$VER-${{ matrix.system }}-any-any-le"
          rm -rf dist && mkdir -p dist
          sh build-pkg.sh dist
          tar czf "$BASE.tar.gz" -C dist mapfield
          sha256sum "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          echo "tarball=$BASE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=$BASE.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - name: Publish the ${{ matrix.system }} account asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true

  # ---- what kind of release is this? ----------------------------------------
  # LAST, because it is correcting the publish steps rather than joining them.
  # Both of them create the release as a side effect of uploading to it, and
  # neither is told what the release is: publish-source marks a pre-release with
  # `contains(ref_name, '-')`, which is FALSE for `dev`; udt-build hands
  # softprops only a tag_name, and its defaults are `prerelease: false` and
  # latest.  So whichever finishes last decides, and left alone a nightly dev
  # build would present itself as the newest stable one -- to the registry, and
  # to anyone installing this package by name.
  #
  # Both directions are set explicitly, for the same reason: leaving the stable
  # case alone means it keeps whatever that race happened to leave behind.
  mark:
    needs: [source, account]
    runs-on: ubuntu-latest
    steps:
      - name: Say what this release is
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # STABLE IS THE ONE THAT IS NOT A PRE-RELEASE.  dev, beta and rc all
          # are; a stable tag is anything with no suffix -- 2.1.0, not
          # 2.1.0-rc1 and not dev.
          case "$TAG" in
            dev|*-*) gh release edit "$TAG" --prerelease --latest=false
                     echo "$TAG is a pre-release, and not latest." ;;
            *)       gh release edit "$TAG" --prerelease=false --latest
                     echo "$TAG is a stable release, and is latest." ;;
          esac
