#
# THE SELF-HOSTED LABELS HAVE TO BE DECLARED HERE or actionlint reports every
# one of them as an error and the job can never pass:
#
#   label "jbase" is unknown. available labels are "windows-latest", ...
#     if it is a custom label for self-hosted runner, set list of labels in
#     actionlint.yaml config file
#
# These are the org's three licensed-MV runners, which the udt, uv and jbase
# jobs select with `runs-on: [self-hosted, linux, <platform>]`.  Keep this list
# in step with the runners actually registered on the org -- a label here that
# no runner carries makes a job QUEUE FOR EVER rather than fail, which
# actionlint cannot tell you about.
self-hosted-runner:
  labels:
    - udt
    - uv
    - jbase
